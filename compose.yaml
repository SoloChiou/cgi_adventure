services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cgi_adventure}
      POSTGRES_USER: ${POSTGRES_USER:-cgi_adventure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先由 .env.example 建立 .env 並設定 POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py seed_game &&
      python manage.py ensure_dev_admin &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-cgi_adventure}
      POSTGRES_USER: ${POSTGRES_USER:-cgi_adventure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先由 .env.example 建立 .env 並設定 POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?請在 .env 設定 DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:?請在 .env 設定 DEV_ADMIN_USERNAME}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:?請在 .env 設定 DEV_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
