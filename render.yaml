services:
  - type: web
    name: cgi-adventure-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: ./start.sh
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cgi-adventure-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_WEB_CHANNEL_ID
        sync: false

  - type: web
    name: cgi-adventure-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_ENV
        value: production
      - key: VITE_LIFF_ID
        sync: false
      - key: VITE_WEB_LIFF_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cgi-adventure-db
    plan: free
    region: singapore
    databaseName: cgi_adventure
    user: cgi_adventure
    ipAllowList: []
