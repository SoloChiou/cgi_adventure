{% extends "base.html" %}
{% block title %}進行轉職｜CGI Adventure{% endblock %}
{% block content %}
<section class="panel narrow">
  <p class="eyebrow">JOB ADVANCEMENT</p>
  <h1>修行突破</h1>
  <p>{{ player.name }} 已符合條件。</p>
  <p>{{ guide }}</p>
  <form method="post" action="{% url 'game:job_transition' %}">
    {% csrf_token %}
    <input type="hidden" name="job_id" value="{{ job.id }}">
    <button type="submit">{{ job.transition_copy }}</button>
  </form>
</section>
{% endblock %}
