{% extends "base.html" %}
{% block title %}選擇第一階職業｜CGI Adventure{% endblock %}
{% block content %}
<section>
  <p class="eyebrow">FIRST JOB CHANGE</p>
  <h1>選擇第一階職業</h1>
  <p>{{ player.name }} 已達 Lv.{{ player.level }}。{{ intro }}</p>
  <div class="card-grid">
    {% for job in jobs %}
      <article class="panel">
        <form method="post" action="{% url 'game:job_transition' %}">
          {% csrf_token %}
          <input type="hidden" name="job_id" value="{{ job.id }}">
          <button type="submit">{{ job.transition_copy }}</button>
        </form>
      </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
