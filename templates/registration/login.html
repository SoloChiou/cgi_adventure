{% extends "base.html" %}
{% block title %}登入 · CGI Adventure{% endblock %}
{% block content %}
<section class="panel narrow">
  <p class="eyebrow">DEVELOPMENT ACCESS</p>
  <h1>進入冒險</h1>
  {% if development_login_enabled %}
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">開發環境登入</button>
  </form>
  {% else %}
  <p>LINE 登入入口尚未完成環境設定，請聯絡管理者。</p>
  {% endif %}
</section>
{% endblock %}
