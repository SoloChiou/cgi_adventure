services:
  - type: web
    name: cgi-adventure-api-dev
    runtime: python
    plan: free
    region: singapore
    branch: develop
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: ./start.sh
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://cgi-adventure-web-dev.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://cgi-adventure-web-dev.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://cgi-adventure-web-dev.onrender.com
      - key: LINE_CHANNEL_ID
        sync: false

  - type: web
    name: cgi-adventure-web-dev
    runtime: static
    branch: develop
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://cgi-adventure-api-dev.onrender.com/api
      - key: VITE_APP_ENV
        value: development
      - key: VITE_LIFF_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
